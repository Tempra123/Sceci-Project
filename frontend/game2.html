<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitChallenge ⚔️ — Ahorcado</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem 2rem;
    }

    /* ── HUD (igual que game.html) ── */
    .hud {
      position: relative; z-index: 10;
      width: 100%; max-width: 780px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.8rem 1.2rem;
      background: rgba(20,15,42,0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      margin-bottom: 1.8rem;
      animation: fadeUp 0.5s ease both;
    }
    .hud-left { display: flex; flex-direction: column; gap: 0.2rem; }
    .hud-logo { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; letter-spacing: 0.1em; color: var(--accent); }
    #nivel-label { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.1em; color: var(--muted); }
    .hud-right { display: flex; align-items: center; gap: 1.5rem; }
    .score-display { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: var(--text-dim); display: flex; align-items: center; gap: 0.4rem; }
    .score-val { color: var(--accent); font-size: 1.1rem; transition: transform 0.2s, color 0.2s; }
    .score-val.bump { transform: scale(1.4); color: var(--green-ok); }
    .question-counter { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--muted); }
    .btn-exit {
      font-family: 'Orbitron', sans-serif; font-size: 0.7rem;
      letter-spacing: 0.08em; color: var(--muted);
      background: transparent; border: 1px solid var(--border);
      border-radius: 5px; padding: 0.35rem 0.75rem; cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-exit:hover { color: var(--red-wrong); border-color: var(--red-wrong); }

    /* ── Barra progreso ── */
    .progress-bar-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 780px;
      height: 5px; background: rgba(124,58,237,0.15);
      border-radius: 99px; margin-bottom: 1.8rem; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--purple-glow), var(--accent));
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 8px rgba(168,85,247,0.7);
    }

    /* ── Tarjeta ── */
    .question-card {
      position: relative; z-index: 10;
      width: 100%; max-width: 780px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem 2.2rem 1.8rem;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-glow);
      animation: scaleIn 0.45s cubic-bezier(.16,1,.3,1) both;
    }

    /* ── Layout interno: SVG | Juego ── */
    .game-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* ── Hint ── */
    .hint-text {
      font-size: 0.92rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      line-height: 1.5;
      margin-bottom: 1.4rem;
      padding: 0.6rem 1rem;
      background: rgba(124,58,237,0.07);
      border-left: 3px solid var(--purple-core);
      border-radius: 0 6px 6px 0;
    }

    /* ── SVG del ahorcado ── */
    .horca-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    #horca-svg {
      width: 180px;
      height: 200px;
    }
    .errores-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    #errores-count {
      color: var(--red-wrong);
      font-weight: 700;
    }

    /* ── Panel derecho ── */
    .game-right {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* ── Palabra oculta ── */
    #word-display {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: flex-end;
      min-height: 60px;
    }
    .letter-box {
      width: 36px; height: 44px;
      border-bottom: 2px solid var(--border-bright);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: var(--accent);
      transition: color 0.3s, border-color 0.3s;
    }
    .letter-box.revealed {
      border-bottom-color: var(--green-ok);
      color: var(--green-ok);
      text-shadow: 0 0 8px rgba(74,222,128,0.5);
    }
    .letter-space { width: 16px; }

    /* ── Letras usadas ── */
    #letras-usadas {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      min-height: 1.2em;
    }

    /* ── Teclado ── */
    #teclado {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .key-btn {
      width: 36px; height: 36px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-dim);
      background: rgba(124,58,237,0.1);
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s, opacity 0.2s;
    }
    .key-btn:hover:not(:disabled) {
      background: rgba(124,58,237,0.3);
      border-color: var(--border-bright);
      transform: translateY(-2px);
      color: var(--text);
    }
    .key-btn:disabled { cursor: not-allowed; opacity: 0.4; }
    .key-btn.key-correct {
      background: rgba(74,222,128,0.2);
      border-color: var(--green-ok);
      color: var(--green-ok);
      opacity: 1;
    }
    .key-btn.key-wrong {
      background: rgba(248,113,113,0.1);
      border-color: var(--red-wrong);
      color: var(--red-wrong);
      opacity: 0.5;
    }

    /* ── Feedback ── */
    .feedback-box {
      margin-top: 1rem; padding: 0.85rem 1.2rem;
      border-radius: 8px; font-weight: 600; font-size: 0.95rem;
      letter-spacing: 0.03em; display: none;
      animation: fadeUp 0.3s ease both;
    }
    .feedback-box.show { display: block; }
    .feedback-box.ok   { background:rgba(74,222,128,0.12); border:1px solid rgba(74,222,128,0.35); color:var(--green-ok); }
    .feedback-box.fail { background:rgba(248,113,113,0.1);  border:1px solid rgba(248,113,113,0.3);  color:var(--red-wrong); }

    /* ── Botón siguiente ── */
    .btn-next {
      margin-top: 1.2rem; display: none; width: 100%;
      padding: 0.9rem;
      font-family: 'Orbitron', sans-serif; font-size: 0.85rem; letter-spacing: 0.1em;
      background: transparent; border: 1px solid var(--border-bright);
      border-radius: 8px; color: var(--text-dim); cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-next.show  { display: block; }
    .btn-next:hover { background: rgba(124,58,237,0.25); color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .game-layout { grid-template-columns: 1fr; }
      .horca-wrap { flex-direction: row; align-items: center; justify-content: center; gap: 1rem; }
      #horca-svg { width: 120px; height: 130px; }
    }

    /* ══════════════════════════════════
       RESULTADOS (igual que game.html)
    ══════════════════════════════════ */
    .results-screen {
      position: relative; z-index: 10;
      width: 100%; max-width: 620px;
      text-align: center; padding: 3rem 2rem;
      animation: scaleIn 0.6s cubic-bezier(.16,1,.3,1) both;
      display: none; flex-direction: column; align-items: center; gap: 1.6rem;
    }
    .results-screen.show { display: flex; }
    .result-trophy { font-size: 4rem; filter: drop-shadow(0 0 24px gold); animation: bounce 1.2s ease-in-out infinite alternate; }
    @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
    .result-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      background: linear-gradient(135deg, gold, #f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .result-score-big {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      color: var(--accent);
      text-shadow: 0 0 30px rgba(232,121,249,0.6);
    }
    .result-score-big span { font-size: 0.42em; color: var(--muted); }
    .result-stats { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .result-message { color: var(--text-dim); font-size: 1.05rem; max-width: 380px; line-height: 1.6; }
    .result-btn-group { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; max-width: 360px; }
    .btn-siguiente {
      width: 100%; padding: 1rem;
      font-family: 'Orbitron', sans-serif; font-size: 0.92rem;
      font-weight: 700; letter-spacing: 0.12em; color: #fff;
      background: linear-gradient(135deg, var(--btn-bg), var(--purple-glow));
      border: none; border-radius: 8px; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 24px rgba(124,58,237,0.5);
    }
    .btn-siguiente:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 0 44px rgba(168,85,247,0.8); }
    .btn-siguiente:disabled { cursor: default; }
    .btn-home {
      font-family: 'Rajdhani', sans-serif; font-size: 0.85rem;
      color: var(--muted); background: transparent; border: none;
      cursor: pointer; letter-spacing: 0.05em;
      text-decoration: underline; text-underline-offset: 3px; padding: 0.3rem;
    }
    .btn-home:hover { color: var(--text-dim); }
  </style>
</head>
<body>

  <!-- Fondo -->
  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="grid-overlay"></div>
  <div class="particles" id="particles"></div>

  <!-- ── HUD ── -->
  <header class="hud" id="hud">
    <div class="hud-left">
      <div class="hud-logo">💀 GITCHALLENGE — AHORCADO</div>
      <span id="nivel-label">NIVEL 1</span>
    </div>
    <div class="hud-right">
      <div class="score-display">★ <span class="score-val" id="score-val">0</span> pts</div>
      <div class="question-counter" id="q-counter">1 / 5</div>
      <button class="btn-exit" onclick="window.location.href='index.html'">✖ Salir</button>
    </div>
  </header>

  <!-- ── Barra de progreso ── -->
  <div class="progress-bar-wrap" id="progress-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <!-- ── Tarjeta principal ── -->
  <section class="question-card" id="question-card">

    <!-- Hint: el enunciado completo de la pregunta -->
    <p class="hint-text" id="hint-text">Cargando pregunta...</p>

    <div class="game-layout">

      <!-- SVG del ahorcado -->
      <div class="horca-wrap">
        <svg id="horca-svg" viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Estructura (siempre visible) -->
          <g id="parte-base"  stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
            <line x1="20" y1="190" x2="160" y2="190"/>
          </g>
          <g id="parte-poste" stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
            <line x1="60" y1="190" x2="60" y2="10"/>
          </g>
          <g id="parte-viga" stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
            <line x1="60" y1="10" x2="120" y2="10"/>
          </g>
          <g id="parte-soga" stroke="#a855f7" stroke-width="2" stroke-linecap="round">
            <line x1="120" y1="10" x2="120" y2="35"/>
          </g>
          <!-- Figura (se muestra por errores) -->
          <g id="parte-cabeza" style="opacity:0; transition: opacity 0.4s;">
            <circle cx="120" cy="50" r="15" stroke="#e879f9" stroke-width="2.5" fill="none"/>
          </g>
          <g id="parte-cuerpo" style="opacity:0; transition: opacity 0.4s;">
            <line x1="120" y1="65" x2="120" y2="120" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
          </g>
          <g id="parte-brazos" style="opacity:0; transition: opacity 0.4s;">
            <line x1="120" y1="80" x2="95"  y2="105" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="120" y1="80" x2="145" y2="105" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
          </g>
          <g id="parte-piernas" style="opacity:0; transition: opacity 0.4s;">
            <line x1="120" y1="120" x2="95"  y2="155" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="120" y1="120" x2="145" y2="155" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </svg>
        <div class="errores-label">Errores: <span id="errores-count">0 / 6</span></div>
      </div>

      <!-- Panel del juego -->
      <div class="game-right">
        <!-- Palabra a adivinar -->
        <div id="word-display"></div>
        <!-- Letras ya usadas -->
        <div id="letras-usadas"></div>
        <!-- Teclado -->
        <div id="teclado"></div>
        <!-- Feedback -->
        <div class="feedback-box" id="feedback-box"></div>
        <!-- Siguiente -->
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">SIGUIENTE →</button>
      </div>
    </div>

  </section>

  <!-- ── Pantalla de resultados ── -->
  <section class="results-screen" id="results-screen">
    <div class="result-trophy" id="result-trophy">🏆</div>
    <h2 class="result-title" id="result-title">¡Desafío Completado!</h2>
    <div class="result-score-big" id="result-score">0 <span>/ 0 pts</span></div>
    <div class="result-stats" id="result-stats"></div>
    <p class="result-message" id="result-message"></p>
    <div class="result-btn-group">
      <button class="btn-siguiente" id="btn-siguiente-nivel" disabled>Cargando...</button>
      <button class="btn-home" onclick="window.location.href='index.html'">↩ Volver al inicio</button>
    </div>
  </section>

  <script src="app2.js"></script>
  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.width = p.style.height = (Math.random() * 2.5 + 1.5) + 'px';
      p.style.animationDuration = (Math.random() * 12 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(p);
    }
  </script>
</body>
</html>
